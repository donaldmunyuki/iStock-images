<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AwesomeUIs - Premium UI Gallery</title>
  <script src="https://tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <style>
    /* Smooth column break handling for native CSS masonry fallback */
    .masonry-item {
      break-inside: avoid;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-50 min-h-screen font-sans transition-colors duration-200">

  <!-- Header / Navigation -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-white/70 dark:bg-slate-950/70 border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="text-2xl font-black tracking-tight bg-gradient-to-r from-indigo-500 to-purple-500 bg-clip-text text-transparent">AwesomeUIs</span>
      <span class="text-xs font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300">Beta</span>
    </div>
    
    <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-600 dark:text-slate-400">
      <a href="#" class="text-indigo-600 dark:text-indigo-400 font-semibold">Explore</a>
      <a href="#" class="hover:text-slate-900 dark:hover:text-slate-100 transition">Websites</a>
      <a href="#" class="hover:text-slate-900 dark:hover:text-slate-100 transition">Mobile Apps</a>
      <a href="#" class="hover:text-slate-900 dark:hover:text-slate-100 transition">Dashboard</a>
    </nav>

    <div class="flex items-center space-x-4">
      <button class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 rounded-full shadow-lg shadow-indigo-500/20 transition duration-150">Submit UI</button>
    </div>
  </header>

  <!-- Main Content Wrapper -->
  <main class="max-w-[1600px] mx-auto px-4 py-8">
    
    <!-- Filter Tags -->
    <div class="flex items-center space-x-2 overflow-x-auto pb-6 mb-4 scrollbar-none">
      <button class="px-4 py-1.5 bg-slate-900 text-white dark:bg-white dark:text-slate-900 text-sm font-medium rounded-full shrink-0">All Work</button>
      <button class="px-4 py-1.5 bg-white text-slate-600 dark:bg-slate-900 dark:text-slate-400 border border-slate-200 dark:border-slate-800 text-sm font-medium rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 shrink-0 transition">Landing Page</button>
      <button class="px-4 py-1.5 bg-white text-slate-600 dark:bg-slate-900 dark:text-slate-400 border border-slate-200 dark:border-slate-800 text-sm font-medium rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 shrink-0 transition">SaaS Dashboard</button>
      <button class="px-4 py-1.5 bg-white text-slate-600 dark:bg-slate-900 dark:text-slate-400 border border-slate-200 dark:border-slate-800 text-sm font-medium rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 shrink-0 transition">Dark Mode</button>
      <button class="px-4 py-1.5 bg-white text-slate-600 dark:bg-slate-900 dark:text-slate-400 border border-slate-200 dark:border-slate-800 text-sm font-medium rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 shrink-0 transition">E-Commerce</button>
    </div>

    <!-- Pinterest-style Masonry Grid -->
    <!-- (Note: For raw CSS, columns are used. In React/Vue, tools like react-masonry-css handle this beautifully) -->
    <div class="columns-1 sm:columns-2 md:columns-3 lg:columns-4 xl:columns-5 gap-4 space-y-4">

      <!-- UI Card 1 (Tall Image example) -->
      <div class="masonry-item group relative break-inside-avoid bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 rounded-2xl overflow-hidden shadow-sm hover:shadow-xl dark:hover:border-slate-700 transition-all duration-300">
        <!-- Interactive Image Wrapper -->
        <div class="relative overflow-hidden cursor-zoom-in bg-slate-100 dark:bg-slate-800">
          <img src="https://unsplash.com" alt="SaaS Landing Page UI" class="w-full object-cover transition duration-500 group-hover:scale-[1.02]">
          
          <!-- Hover Overlay Layers -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-between p-4">
            <!-- Top Action (Save/Favorite) -->
            <div class="flex justify-end">
              <button class="p-2 bg-white/20 backdrop-blur-md hover:bg-white/40 text-white rounded-full transition" title="Save to collection">
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" />
                </svg>
              </button>
            </div>
            
            <!-- Bottom Actions & Attribution -->
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-2 text-white">
                <div class="w-7 h-7 bg-indigo-500 rounded-full flex items-center justify-center font-bold text-xs">JD</div>
                <span class="text-xs font-medium truncate max-w-[120px]">John Doe</span>
              </div>
              <div class="flex space-x-1.5">
                <!-- View Live Link -->
                <a href="#" target="_blank" class="p-2 bg-white hover:bg-slate-100 text-slate-900 rounded-full transition shadow" title="View Live Site">
                  <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
                  </svg>
                </a>
                <!-- Protected Download Trigger -->
                <button class="p-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full transition shadow" title="Download High-Res">
                  <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Visible Title Details (Stays clean underneath image) -->
        <div class="p-3">
          <h3 class="text-sm font-semibold truncate text-slate-800 dark:text-slate-200">Quantum Dashboard Minimal</h3>
          <p class="text-xs text-slate-400 dark:text-slate-500 mt-0.5">SaaS Dashboard &bull; Dark Mode</p>
        </div>
      </div>

      <!-- UI Card 2 (Medium Image example) -->
      <div class="masonry-item group relative break-inside-avoid bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 rounded-2xl overflow-hidden shadow-sm hover:shadow-xl dark:hover:border-slate-700 transition-all duration-300">
        <div class="relative overflow-hidden cursor-zoom-in bg-slate-100 dark:bg-slate-800">
          <img src="https://unsplash.com" alt="Mobile App UI" class="w-full object-cover transition duration-500 group-hover:scale-[1.02]">
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-between p-4">
            <div class="flex justify-end"><button class="p-2 bg-white/20 backdrop-blur-md hover:bg-white/40 text-white rounded-full transition"><svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" /></svg></button></div>
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-2 text-white"><div class="w-7 h-7 bg-purple-500 rounded-full flex items-center justify-center font-bold text-xs">AS</div><span class="text-xs font-medium truncate max-w-[120px]">Alex Smith</span></div>
              <div class="flex space-x-1.5">
                <button class="p-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full transition shadow"><svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg></button>
              </div>
            </div>
          </div>
        </div>
        <div class="p-3">
          <h3 class="text-sm font-semibold truncate text-slate-800 dark:text-slate-200">Crypto Wallet Mobile App</h3>
          <p class="text-xs text-slate-400 dark:text-slate-500 mt-0.5">Mobile &bull; iOS</p>
        </div>
      </div>
